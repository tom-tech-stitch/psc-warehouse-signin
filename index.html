<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSC Warehouse sign in</title>
<style>
  :root { --bg:#f6f5f2; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6a66; --line:#e3e1dc; --accent:#1f5f4a; --accent-ink:#ffffff; --err:#a3311f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151514; --card:#1e1e1c; --ink:#ecebe7; --muted:#a3a29d; --line:#33322f; --accent:#4fa383; --accent-ink:#0d1f18; --err:#e0826f; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding:16px; }
  main { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px 24px; }
  h1 { font-size:18px; margin:0 0 4px; }
  p { margin:0 0 16px; color:var(--muted); }
  .who { color:var(--ink); font-weight:600; }
  button, .btn { display:block; width:100%; padding:11px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card);
                 color:var(--ink); font:inherit; font-weight:600; cursor:pointer; margin-top:10px; }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  input { display:block; width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg);
          color:var(--ink); font:inherit; margin-top:8px; }
  .link { background:none; border:none; color:var(--muted); font-weight:400; text-decoration:underline; padding:6px 0; width:auto; margin:10px auto 0; }
  .err { color:var(--err); margin-top:12px; }
  .hidden { display:none; }
  hr { border:none; border-top:1px solid var(--line); margin:18px 0 8px; }
</style>
</head>
<body>
<main>
  <h1>PSC Warehouse</h1>
  <div id="loading"><p>Loading...</p></div>

  <div id="signin" class="hidden">
    <p>Sign in to let Claude query the PSC warehouse for you.</p>
    <button class="primary" id="google">Sign in with Google</button>
    <button class="link" id="show-pw">Use email and password</button>
    <form id="pw" class="hidden">
      <hr>
      <input id="email" type="email" autocomplete="username" placeholder="Email" required>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>

  <div id="consent" class="hidden">
    <p>Claude is asking to query the PSC warehouse as <span class="who" id="who"></span>. What you can see depends on your access level.</p>
    <button class="primary" id="approve">Allow</button>
    <button id="deny">Deny</button>
    <button class="link" id="signout">Not you? Sign out</button>
  </div>

  <div id="error" class="err hidden"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
(async () => {
  const sb = supabase.createClient("https://qsunjpebauxprqjlkloz.supabase.co", "sb_publishable_rndoKdCgxv6x5PCNSRHyOg_38QxcOjF", { auth: { flowType: 'pkce', detectSessionInUrl: true, persistSession: true } })
  const allowedHosts = ["claude.ai","claude.com"]
  const $ = (id) => document.getElementById(id)
  const show = (id) => { for (const x of ['loading','signin','consent']) $(x).classList.toggle('hidden', x !== id) }
  const fail = (msg) => { $('error').textContent = msg; $('error').classList.remove('hidden'); $('loading').classList.add('hidden') }

  const params = new URLSearchParams(location.search)
  const authId = params.get('authorization_id')
  if (!authId) return fail('This page is opened by Claude when you connect the PSC Warehouse connector. Start from Claude.')
  const here = location.origin + location.pathname + '?authorization_id=' + encodeURIComponent(authId)

  const hostAllowed = (u) => { try { const h = new URL(u).hostname; return allowedHosts.some((a) => h === a || h.endsWith('.' + a)) } catch { return false } }
  const go = (u) => { if (!hostAllowed(u)) return fail('Blocked: this request does not return to Claude.'); location.href = u }

  $('google').onclick = async () => {
    const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: here } })
    if (error) fail(error.message)
  }
  $('show-pw').onclick = () => { $('pw').classList.remove('hidden'); $('show-pw').classList.add('hidden') }
  $('pw').onsubmit = async (e) => {
    e.preventDefault()
    const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value })
    if (error) return fail(error.message)
    location.replace(here)
  }
  $('signout').onclick = async () => { await sb.auth.signOut(); location.replace(here) }

  const { data: { session } } = await sb.auth.getSession()
  if (params.get('code') && session) return location.replace(here)
  if (!session) return show('signin')

  const { data: details, error } = await sb.auth.oauth.getAuthorizationDetails(authId)
  if (error) return fail(error.message)
  if (!('authorization_id' in details)) return go(details.redirect_url)
  if (!hostAllowed(details.redirect_uri)) return fail('Blocked: this request does not return to Claude.')

  $('who').textContent = session.user.email
  show('consent')
  $('approve').onclick = async () => {
    const { data, error } = await sb.auth.oauth.approveAuthorization(authId)
    if (error) return fail(error.message)
    go(data.redirect_url)
  }
  $('deny').onclick = async () => {
    const { data, error } = await sb.auth.oauth.denyAuthorization(authId)
    if (error) return fail(error.message)
    go(data.redirect_url)
  }
})().catch((e) => {
  const el = document.getElementById('error'); el.textContent = String(e && e.message || e); el.classList.remove('hidden')
})
</script>
</body>
</html>
