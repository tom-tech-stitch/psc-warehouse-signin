<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://qsunjpebauxprqjlkloz.supabase.co; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSC Warehouse sign in</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <h1>PSC Warehouse</h1>
  <div id="loading"><p>Loading...</p></div>

  <div id="signin" class="hidden">
    <p>Sign in to let Claude query the PSC warehouse for you.</p>
    <button class="primary" id="google" type="button">Sign in with Google</button>
    <button class="link" id="show-pw" type="button">Use email and password</button>
    <form id="pw" class="hidden">
      <hr>
      <input id="email" type="email" autocomplete="username" placeholder="Email" required>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>

  <div id="consent" class="hidden">
    <p>Claude is asking to query the PSC warehouse as <span class="who" id="who"></span>. What you can see depends on your access level.</p>
    <button class="primary" id="approve" type="button">Allow</button>
    <button id="deny" type="button">Deny</button>
    <button class="link" id="signout" type="button">Not you? Sign out</button>
  </div>

  <div id="error" class="err hidden"></div>
</main>
<script src="supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
